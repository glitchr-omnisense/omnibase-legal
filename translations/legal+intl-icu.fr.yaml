jurist:
    # What the law reserves (Base\Legal\Jurist\Enum\ReservedActivity).
    activity:
        legal_consultation: Consultation juridique personnalisée
        deed_drafting: Rédaction d’actes pour autrui
    # Why a text is refused (Base\Legal\Jurist\Service\RegulatedActivityGuard).
    guard:
        legal_consultation: 'Le texte annonce une consultation ou un conseil juridique personnalisé, réservé aux professions qui y sont autorisées (loi du 31 décembre 1971, art. 54 et suivants). Présentez la prestation comme une formation ou une information documentaire, ou indiquez le statut qui vous y autorise (legal.jurist.authorized_status).'
        deed_drafting: 'Le texte annonce la rédaction d’actes pour autrui, réservée aux professions qui y sont autorisées (loi du 31 décembre 1971, art. 54) : reformulez-le.'
