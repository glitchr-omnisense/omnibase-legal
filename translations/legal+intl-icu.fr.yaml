    tariff:
        title: Tarifs
        lead: La rémunération du notaire est fixée par l’État pour les actes tarifés ; elle est la même dans tous les offices de France.
        what: Ce que recouvrent les « frais de notaire »
        what_taxes: <strong>Les droits et taxes</strong>, perçus par le notaire pour le compte de l’État et des collectivités, puis reversés au Trésor public.
        what_disbursements: <strong>Les débours</strong>, sommes avancées pour votre compte afin de payer les intervenants et les documents nécessaires à l’acte.
