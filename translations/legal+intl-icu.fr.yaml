notary:
    contact:
        notice: Ce formulaire n’est pas confidentiel. N’y joignez et n’y décrivez <strong>aucune pièce ni information confidentielle</strong> — une fois votre dossier ouvert, déposez vos documents dans le coffre chiffré de votre espace client.

