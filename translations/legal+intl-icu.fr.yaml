        regulated: Les actes tarifés — émoluments
        regulated_text: 'Les émoluments sont fixés par le code de commerce (articles L. 444-1 et suivants, R. 444-1 et suivants, A. 444-53 et suivants). Le tarif en vigueur est celui de l’{order}.'
        regulated_until: 'Il s’applique jusqu’au {date}.'
        official: Le texte officiel
        official_code: Code de commerce — tarif des notaires (Légifrance)
        official_order: 'L’{order} (Légifrance)'
        official_info: Le tarif expliqué par les Notaires de France
        discounts: 'Remises pratiquées par {the_practice}'
        discounts_missing: Les remises pratiquées ne sont pas encore indiquées ici.
        fees: Les prestations non tarifées — honoraires
        fees_text: Pour les prestations que le tarif ne couvre pas (consultation, conseil, rédaction de certains actes), le notaire convient avec son client d’honoraires, par une convention écrite établie avant toute intervention.
        statement: Un état détaillé des frais vous est remis à l’issue des formalités ; il distingue les droits payés au Trésor, les débours, les émoluments et les honoraires.
        payment: Règlement
        payment_text: 'Aucun paiement n’est proposé sur ce site. Les règlements se font auprès {of_the_practice}, où l’on vous en indique les modalités.'
        dispute: En cas de désaccord
